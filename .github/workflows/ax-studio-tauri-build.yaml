name: Tauri Builder - Tag

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release version to build, for example 1.3.0"
        required: true
        type: string

# Never run two release pipelines for the same version at once: interleaved
# asset uploads + publish would assemble a half-built release.
concurrency:
  group: tauri-release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

# Least privilege by default; jobs that touch the release opt into write.
permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4

      - name: Installing node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate release config
        run: node scripts/release/validate-release-config.mjs

  # Job create Update app version based on latest release tag with build number and save to output
  get-update-version:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            echo "::error::Release version is required for non-tag events."
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.3.3, got: $version"
            exit 1
          fi

          echo "new_version=$version" >> "$GITHUB_OUTPUT"

  validate-release-tag:
    runs-on: ubuntu-latest
    needs: get-update-version
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag exists
        env:
          VERSION: ${{ needs.get-update-version.outputs.new_version }}
        run: |
          test -n "$VERSION"
          git fetch origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          git rev-parse --verify "refs/tags/v${VERSION}"

  create-draft-release:
    runs-on: ubuntu-latest
    needs: [get-update-version, validate-release-tag]
    outputs:
      version: ${{ needs.get-update-version.outputs.new_version }}
    permissions:
      contents: write
    steps:
      - name: Create or draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.get-update-version.outputs.new_version }}
          TAG: v${{ needs.get-update-version.outputs.new_version }}
        run: |
          if is_draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" = "true" ]; then
              gh release edit "$TAG" --draft=true --prerelease=false --repo "$GITHUB_REPOSITORY"
            else
              # Re-drafting a published release takes every download URL
              # (Homebrew, updater latest.json, docs links) offline for all
              # users. Ship a new patch version instead of rebuilding over a
              # live release; delete the release manually to force a rebuild.
              echo "::error::Release $TAG is already published. Refusing to re-draft a live release."
              exit 1
            fi
          else
            gh release create "$TAG" --title "$VERSION" --draft --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

  build-macos:
    runs-on: macos-latest
    needs: [get-update-version, validate-release-tag, create-draft-release]
    env:
      HAS_SIGN_CERTS: ${{ secrets.CODE_SIGN_P12_BASE64 != '' && secrets.CODE_SIGN_P12_PASSWORD != '' && secrets.NOTARIZE_P8_BASE64 != '' && secrets.NOTARY_ISSUER != '' && secrets.NOTARY_KEY_ID != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    outputs:
      MAC_UNIVERSAL_SIG: ${{ steps.metadata.outputs.MAC_UNIVERSAL_SIG }}
      FILE_NAME: ${{ steps.metadata.outputs.FILE_NAME }}
      DMG_NAME: ${{ steps.metadata.outputs.DMG_NAME }}
      TAR_NAME: ${{ steps.metadata.outputs.TAR_NAME }}
    permissions:
      contents: write
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ needs.get-update-version.outputs.new_version }}

      - name: Installing node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install jq
        uses: dcarbone/install-jq-action@v2.0.1

      - name: Install ctoml
        run: cargo install ctoml

      - name: Set up Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Check signing configuration
        run: |
          if [ "$HAS_SIGN_CERTS" = "true" ]; then
            echo "::notice::Code signing and notarization enabled."
          else
            echo "::warning::CODE_SIGN_P12_BASE64 / NOTARIZE_P8_BASE64 not configured — building unsigned DMG."
          fi
          if [ "$HAS_UPDATER_KEY" = "true" ]; then
            echo "::notice::Updater signing enabled."
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not configured — updater artifacts will be skipped."
          fi

      - name: Update app version from release tag
        env:
          VERSION: ${{ needs.get-update-version.outputs.new_version }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          # Enable updater artifacts only when the signing key is available
          if [ "$HAS_UPDATER_KEY" = "true" ] && [ -n "$TAURI_UPDATER_PUBKEY" ]; then
            jq --arg version "$VERSION" --arg pubkey "$TAURI_UPDATER_PUBKEY" \
              '.version = $version | .bundle.createUpdaterArtifacts = true | .plugins.updater.pubkey = $pubkey' \
              ./src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          else
            jq --arg version "$VERSION" \
              '.version = $version | .bundle.createUpdaterArtifacts = false' \
              ./src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          fi
          mv /tmp/tauri.conf.json ./src-tauri/tauri.conf.json

          jq --arg version "$VERSION" '.version = $version' web-app/package.json > /tmp/package.json
          mv /tmp/package.json web-app/package.json

          jq --arg version "$VERSION" '.version = $version' ./src-tauri/plugins/tauri-plugin-hardware/package.json > /tmp/package.json
          mv /tmp/package.json ./src-tauri/plugins/tauri-plugin-hardware/package.json

          jq --arg version "$VERSION" '.version = $version' ./src-tauri/plugins/tauri-plugin-llamacpp/package.json > /tmp/package.json
          mv /tmp/package.json ./src-tauri/plugins/tauri-plugin-llamacpp/package.json

          ctoml ./src-tauri/plugins/tauri-plugin-hardware/Cargo.toml package.version "$VERSION"
          ctoml ./src-tauri/plugins/tauri-plugin-llamacpp/Cargo.toml package.version "$VERSION"
          ctoml ./src-tauri/Cargo.toml package.version "$VERSION"
          ctoml ./src-tauri/Cargo.toml dependencies.tauri.features[] "devtools"

      - name: Get key for notarize
        if: ${{ env.HAS_SIGN_CERTS == 'true' }}
        run: base64 -d <<< "$NOTARIZE_P8_BASE64" > /tmp/notary-key.p8
        shell: bash
        env:
          NOTARIZE_P8_BASE64: ${{ secrets.NOTARIZE_P8_BASE64 }}

      - uses: apple-actions/import-codesign-certs@v2
        if: ${{ env.HAS_SIGN_CERTS == 'true' }}
        with:
          p12-file-base64: ${{ secrets.CODE_SIGN_P12_BASE64 }}
          p12-password: ${{ secrets.CODE_SIGN_P12_PASSWORD }}

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Build app
        run: |
          if [ "$HAS_SIGN_CERTS" = "true" ]; then
            export APPLE_API_KEY_PATH=/tmp/notary-key.p8
            export APPLE_CERTIFICATE="$_APPLE_CERTIFICATE"
            export APPLE_CERTIFICATE_PASSWORD="$_APPLE_CERTIFICATE_PASSWORD"
            export APPLE_API_ISSUER="$_APPLE_API_ISSUER"
            export APPLE_API_KEY="$_APPLE_API_KEY"
          fi
          make build
        env:
          NODE_OPTIONS: "--max-old-space-size=4196"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_PATH: '.'
          _APPLE_CERTIFICATE: ${{ secrets.CODE_SIGN_P12_BASE64 }}
          _APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CODE_SIGN_P12_PASSWORD }}
          _APPLE_API_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          _APPLE_API_KEY: ${{ secrets.NOTARY_KEY_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AX_STUDIO_SIGNING_KEY: ${{ secrets.AX_STUDIO_SIGNING_KEY }}

      - name: Set output filename for mac
        id: metadata
        env:
          VERSION: ${{ needs.get-update-version.outputs.new_version }}
        run: |
          cd ./src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          zip -r "ax-studio-mac-arm64-${VERSION}.zip" Ax-Studio.app
          SIG_FILE="Ax-Studio.app.tar.gz.sig"
          MAC_UNIVERSAL_SIG=$( [ -f "$SIG_FILE" ] && cat "$SIG_FILE" || echo "" )
          {
            echo "MAC_UNIVERSAL_SIG=${MAC_UNIVERSAL_SIG}"
            echo "FILE_NAME=ax-studio-mac-arm64-${VERSION}.zip"
            echo "DMG_NAME=Ax-Studio_${VERSION}_aarch64.dmg"
            echo "TAR_NAME=Ax-Studio.app.tar.gz"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.get-update-version.outputs.new_version }}
        run: |
          BUNDLE_MACOS="./src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          BUNDLE_DMG="./src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          FILES=(
            "$BUNDLE_MACOS/${{ steps.metadata.outputs.FILE_NAME }}"
            "$BUNDLE_DMG/${{ steps.metadata.outputs.DMG_NAME }}"
          )
          TAR="$BUNDLE_MACOS/${{ steps.metadata.outputs.TAR_NAME }}"
          [ -f "$TAR" ] && FILES+=("$TAR")
          gh release upload "v${VERSION}" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  sync-temp-to-latest:
    needs: [create-draft-release, get-update-version, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4

      - name: create latest.json file
        run: |
          VERSION=${{ needs.get-update-version.outputs.new_version }}
          DARWIN_SIGNATURE="${{ needs.build-macos.outputs.MAC_UNIVERSAL_SIG }}"
          TAR_NAME="${{ needs.build-macos.outputs.TAR_NAME }}"
          DMG_NAME="${{ needs.build-macos.outputs.DMG_NAME }}"
          # Use tar URL when signature is present (updater), DMG URL otherwise
          if [ -n "$DARWIN_SIGNATURE" ]; then
            DARWIN_URL="https://github.com/defai-digital/ax-studio/releases/download/v${VERSION}/${TAR_NAME}"
          else
            DARWIN_URL="https://github.com/defai-digital/ax-studio/releases/download/v${VERSION}/${DMG_NAME}"
          fi

          node scripts/release/create-latest-json.mjs \
            --version "$VERSION" \
            --darwin-signature "$DARWIN_SIGNATURE" \
            --darwin-url "$DARWIN_URL" \
            --out latest.json
          node scripts/release/verify-latest-json.mjs --file latest.json --version "$VERSION"
          cat latest.json

      - name: Upload latest.json to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.get-update-version.outputs.new_version }}" \
            ./latest.json \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  sign-release-assets:
    needs: [get-update-version, sync-temp-to-latest]
    runs-on: ubuntu-latest
    env:
      HAS_MINISIGN_KEY: ${{ secrets.AX_STUDIO_MINISIGN_SECRET_KEY_B64 != '' && secrets.AX_STUDIO_MINISIGN_PUBLIC_KEY != '' }}
    permissions:
      contents: write
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4

      - name: Skip if minisign secrets are not configured
        if: ${{ env.HAS_MINISIGN_KEY != 'true' }}
        run: echo "::notice::AX_STUDIO_MINISIGN_SECRET_KEY_B64 or AX_STUDIO_MINISIGN_PUBLIC_KEY not configured — skipping detached minisign signatures."

      - name: Install minisign
        if: ${{ env.HAS_MINISIGN_KEY == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Download release assets
        if: ${{ env.HAS_MINISIGN_KEY == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts signkey
          gh release download "v${{ needs.get-update-version.outputs.new_version }}" \
            --dir artifacts \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Ax-Studio_${{ needs.get-update-version.outputs.new_version }}_aarch64.dmg" \
            --pattern "Ax-Studio.app.tar.gz" \
            --pattern "ax-studio-mac-arm64-${{ needs.get-update-version.outputs.new_version }}.zip" \
            --pattern "latest.json"

      - name: Sign release assets with minisign
        if: ${{ env.HAS_MINISIGN_KEY == 'true' }}
        env:
          MINISIGN_PASSWORD: ${{ secrets.AX_STUDIO_MINISIGN_PASSWORD }}
          AX_STUDIO_MINISIGN_SECRET_KEY_B64: ${{ secrets.AX_STUDIO_MINISIGN_SECRET_KEY_B64 }}
          AX_STUDIO_MINISIGN_PUBLIC_KEY: ${{ secrets.AX_STUDIO_MINISIGN_PUBLIC_KEY }}
        run: |
          printf '%s' "$AX_STUDIO_MINISIGN_SECRET_KEY_B64" | base64 --decode > signkey/ax-studio.minisign.key
          printf '%s\n' "$AX_STUDIO_MINISIGN_PUBLIC_KEY" > signkey/ax-studio.minisign.pub
          # Sign whatever the download step actually fetched: optional assets
          # (e.g. Ax-Studio.app.tar.gz without an updater key) may be absent,
          # and a hard-coded list would fail the whole release on them.
          files=()
          for f in artifacts/*; do
            case "$f" in
              *.minisig) ;;
              *) files+=("$f") ;;
            esac
          done
          node scripts/release/minisign-artifacts.mjs --key-dir signkey "${files[@]}"

      - name: Upload minisign signatures
        if: ${{ env.HAS_MINISIGN_KEY == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.get-update-version.outputs.new_version }}" artifacts/*.minisig --clobber --repo "$GITHUB_REPOSITORY"

  verify-release-assets:
    needs: [get-update-version, sign-release-assets]
    runs-on: ubuntu-latest
    permissions:
      # The release is still a draft at this point, and draft releases are
      # only visible to tokens with write access — a read-only GITHUB_TOKEN
      # gets "release not found" from gh. This job never writes.
      contents: write
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4

      - name: Verify GitHub release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release/verify-release-assets.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "v${{ needs.get-update-version.outputs.new_version }}" \
            --version "${{ needs.get-update-version.outputs.new_version }}"
          gh release download "v${{ needs.get-update-version.outputs.new_version }}" \
            --dir artifacts \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "latest.json"
          node scripts/release/verify-latest-json.mjs \
            --file artifacts/latest.json \
            --version "${{ needs.get-update-version.outputs.new_version }}"

  publish-release:
    needs: [create-draft-release, get-update-version, verify-release-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.get-update-version.outputs.new_version }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  update-homebrew-tap:
    needs: [get-update-version, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read # pushes via HOMEBREW_TAP_TOKEN, never GITHUB_TOKEN
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' || secrets.TAP_TOKEN != '' }}
    steps:
      - name: Skip if no tap token configured
        if: ${{ env.HAS_TAP_TOKEN != 'true' }}
        run: echo "::notice::HOMEBREW_TAP_TOKEN or TAP_TOKEN not configured — skipping Homebrew tap update."

      - name: Download release DMG and compute SHA256
        if: ${{ env.HAS_TAP_TOKEN == 'true' }}
        env:
          VERSION: ${{ needs.get-update-version.outputs.new_version }}
        run: |
          # Assets can take a moment to propagate right after publish; retry
          # instead of stranding Homebrew users on the previous version.
          curl -fSL --retry 6 --retry-all-errors --retry-delay 10 -o release.dmg \
            "https://github.com/defai-digital/ax-studio/releases/download/v${VERSION}/Ax-Studio_${VERSION}_aarch64.dmg"
          echo "DMG_SHA256=$(sha256sum release.dmg | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Push updated cask to homebrew tap
        if: ${{ env.HAS_TAP_TOKEN == 'true' }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.TAP_TOKEN }}
          VERSION: ${{ needs.get-update-version.outputs.new_version }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/defai-digital/homebrew-ax-studio.git" homebrew-tap
          node scripts/release/write-homebrew-cask.mjs \
            --version "$VERSION" \
            --sha256 "$DMG_SHA256" \
            --out homebrew-tap/Casks/ax-studio.rb
          ruby -c homebrew-tap/Casks/ax-studio.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/ax-studio.rb
          git diff --cached --quiet && echo "No cask changes to commit." && exit 0
          git commit -m "Update ax-studio cask to ${VERSION}"
          git push
