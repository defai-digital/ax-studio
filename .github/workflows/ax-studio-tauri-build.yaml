name: Tauri Builder - Tag

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release version to build, for example 1.3.0"
        required: true
        type: string

# Never run two release pipelines for the same version at once: interleaved
# asset uploads + publish would assemble a half-built release.
concurrency:
  group: tauri-release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

# Least privilege by default; jobs that touch the release opt into write.
permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4

      - name: Installing node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'

      - name: Validate release config
        run: node scripts/release/validate-release-config.mjs

  # Job create Update app version based on latest release tag with build number and save to output
  get-update-version:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            echo "::error::Release version is required for non-tag events."
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.3.3, got: $version"
            exit 1
          fi

          echo "new_version=$version" >> "$GITHUB_OUTPUT"

  validate-release-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: get-update-version
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag exists
        env:
          VERSION: ${{ needs.get-update-version.outputs.new_version }}
        run: |
          test -n "$VERSION"
          git fetch --force origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          git rev-parse --verify "refs/tags/v${VERSION}"

  create-draft-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [get-update-version, validate-release-tag]
    outputs:
      version: ${{ needs.get-update-version.outputs.new_version }}
    permissions:
      contents: write
    steps:
      - name: Create or draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.get-update-version.outputs.new_version }}
          TAG: v${{ needs.get-update-version.outputs.new_version }}
        run: |
          if is_draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" = "true" ]; then
              gh release edit "$TAG" --draft=true --prerelease=false --repo "$GITHUB_REPOSITORY"
            else
              # Keep the published release online while rebuilding assets for
              # the same tag. Later upload steps use --clobber, and the final
              # Homebrew step updates the tap to the new DMG checksum.
              echo "::notice::Release $TAG is already published; continuing to replace assets in place."
            fi
          else
            gh release create "$TAG" --title "$VERSION" --draft --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

  build-macos:
    needs: [get-update-version, validate-release-tag, create-draft-release]
    uses: ./.github/workflows/template-tauri-build-macos.yml
    with:
      ref: refs/tags/v${{ needs.get-update-version.outputs.new_version }}
      public_provider: github
      new_version: ${{ needs.get-update-version.outputs.new_version }}
      channel: stable
    secrets: inherit

  build-windows:
    needs: [get-update-version, validate-release-tag, create-draft-release]
    uses: ./.github/workflows/template-tauri-build-windows-x64.yml
    with:
      ref: refs/tags/v${{ needs.get-update-version.outputs.new_version }}
      public_provider: github
      new_version: ${{ needs.get-update-version.outputs.new_version }}
      channel: stable
    secrets: inherit

  build-windows-arm64:
    needs: [get-update-version, validate-release-tag, create-draft-release]
    uses: ./.github/workflows/template-tauri-build-windows-arm64.yml
    with:
      ref: refs/tags/v${{ needs.get-update-version.outputs.new_version }}
      public_provider: github
      new_version: ${{ needs.get-update-version.outputs.new_version }}
      channel: stable
    secrets: inherit

  sync-temp-to-latest:
    needs: [create-draft-release, get-update-version, build-macos, build-windows, build-windows-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4

      - name: create latest.json file
        run: |
          VERSION=${{ needs.get-update-version.outputs.new_version }}
          asset_url() {
            local asset_name="$1"
            printf 'https://github.com/defai-digital/ax-studio/releases/download/v%s/%s' \
              "$VERSION" "${asset_name// /%20}"
          }

          DARWIN_SIGNATURE="${{ needs.build-macos.outputs.MAC_UNIVERSAL_SIG }}"
          TAR_NAME="${{ needs.build-macos.outputs.TAR_NAME }}"
          DMG_NAME="${{ needs.build-macos.outputs.DMG_NAME }}"
          # Use tar URL when signature is present (updater), DMG URL otherwise
          if [ -n "$DARWIN_SIGNATURE" ]; then
            DARWIN_URL="$(asset_url "$TAR_NAME")"
          else
            DARWIN_URL="$(asset_url "$DMG_NAME")"
          fi

          WIN_SIGNATURE="${{ needs.build-windows.outputs.WIN_SIG }}"
          WIN_NSIS="${{ needs.build-windows.outputs.FILE_NAME }}"
          WINDOWS_URL=""
          if [ -n "$WIN_NSIS" ]; then
            WINDOWS_URL="$(asset_url "$WIN_NSIS")"
          fi
          WIN_ARM64_SIGNATURE="${{ needs.build-windows-arm64.outputs.WIN_ARM64_SIG }}"
          WIN_ARM64_NSIS="${{ needs.build-windows-arm64.outputs.FILE_NAME }}"
          WINDOWS_ARM64_URL=""
          if [ -n "$WIN_ARM64_NSIS" ]; then
            WINDOWS_ARM64_URL="$(asset_url "$WIN_ARM64_NSIS")"
          fi

          node scripts/release/create-latest-json.mjs \
            --version "$VERSION" \
            --darwin-signature "$DARWIN_SIGNATURE" \
            --darwin-url "$DARWIN_URL" \
            --windows-x64-signature "$WIN_SIGNATURE" \
            --windows-x64-url "$WINDOWS_URL" \
            --windows-arm64-signature "$WIN_ARM64_SIGNATURE" \
            --windows-arm64-url "$WINDOWS_ARM64_URL" \
            --out latest.json
          node scripts/release/verify-latest-json.mjs --file latest.json --version "$VERSION"
          cat latest.json

      - name: Upload latest.json to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.get-update-version.outputs.new_version }}" \
            ./latest.json \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  sign-release-assets:
    needs: [get-update-version, sync-temp-to-latest, build-windows, build-windows-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_MINISIGN_KEY: ${{ secrets.AX_STUDIO_MINISIGN_SECRET_KEY_B64 != '' && secrets.AX_STUDIO_MINISIGN_PUBLIC_KEY != '' && secrets.AX_STUDIO_MINISIGN_PASSWORD != '' }}
    permissions:
      contents: write
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4

      - name: Validate Minisign secrets
        if: ${{ env.HAS_MINISIGN_KEY != 'true' }}
        run: |
          echo "::error::Stable releases require AX_STUDIO_MINISIGN_SECRET_KEY_B64, AX_STUDIO_MINISIGN_PUBLIC_KEY, and AX_STUDIO_MINISIGN_PASSWORD."
          exit 1

      - name: Install minisign
        if: ${{ env.HAS_MINISIGN_KEY == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Download release assets
        if: ${{ env.HAS_MINISIGN_KEY == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts signkey
          gh release download "v${{ needs.get-update-version.outputs.new_version }}" \
            --dir artifacts \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "AX Studio_${{ needs.get-update-version.outputs.new_version }}_aarch64.dmg" \
            --pattern "AX.Studio_${{ needs.get-update-version.outputs.new_version }}_aarch64.dmg" \
            --pattern "AX.Studio.app.tar.gz" \
            --pattern "ax-studio-mac-arm64-${{ needs.get-update-version.outputs.new_version }}.zip" \
            --pattern "AX.Studio_${{ needs.get-update-version.outputs.new_version }}_x64-setup.exe" \
            --pattern "AX.Studio_${{ needs.get-update-version.outputs.new_version }}_x64-portable.exe" \
            --pattern "AX.Studio_${{ needs.get-update-version.outputs.new_version }}_arm64-setup.exe" \
            --pattern "AX.Studio_${{ needs.get-update-version.outputs.new_version }}_arm64-portable.exe" \
            --pattern "latest.json"

      - name: Sign release assets with minisign
        if: ${{ env.HAS_MINISIGN_KEY == 'true' }}
        env:
          MINISIGN_PASSWORD: ${{ secrets.AX_STUDIO_MINISIGN_PASSWORD }}
          AX_STUDIO_MINISIGN_SECRET_KEY_B64: ${{ secrets.AX_STUDIO_MINISIGN_SECRET_KEY_B64 }}
          AX_STUDIO_MINISIGN_PUBLIC_KEY: ${{ secrets.AX_STUDIO_MINISIGN_PUBLIC_KEY }}
        run: |
          printf '%s' "$AX_STUDIO_MINISIGN_SECRET_KEY_B64" | base64 --decode > signkey/ax-studio.minisign.key
          printf '%s\n' "$AX_STUDIO_MINISIGN_PUBLIC_KEY" > signkey/ax-studio.minisign.pub
          # Sign whatever the download step actually fetched: optional assets
          # (e.g. AX Studio.app.tar.gz without an updater key) may be absent,
          # and a hard-coded list would fail the whole release on them.
          files=()
          for f in artifacts/*; do
            case "$f" in
              *.minisig) ;;
              *) files+=("$f") ;;
            esac
          done
          node scripts/release/minisign-artifacts.mjs --key-dir signkey "${files[@]}"

      - name: Upload minisign signatures
        if: ${{ env.HAS_MINISIGN_KEY == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.get-update-version.outputs.new_version }}" artifacts/*.minisig --clobber --repo "$GITHUB_REPOSITORY"

  verify-release-assets:
    needs: [get-update-version, sign-release-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The release is still a draft at this point, and draft releases are
      # only visible to tokens with write access — a read-only GITHUB_TOKEN
      # gets "release not found" from gh. This job never writes.
      contents: write
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4

      - name: Verify GitHub release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release/verify-release-assets.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "v${{ needs.get-update-version.outputs.new_version }}" \
            --version "${{ needs.get-update-version.outputs.new_version }}"
          gh release download "v${{ needs.get-update-version.outputs.new_version }}" \
            --dir artifacts \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "latest.json"
          node scripts/release/verify-latest-json.mjs \
            --file artifacts/latest.json \
            --version "${{ needs.get-update-version.outputs.new_version }}"

  publish-release:
    needs: [create-draft-release, get-update-version, verify-release-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.get-update-version.outputs.new_version }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  update-homebrew-tap:
    needs: [get-update-version, publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # pushes via HOMEBREW_TAP_TOKEN, never GITHUB_TOKEN
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' || secrets.TAP_TOKEN != '' }}
    steps:
      - name: Skip if no tap token configured
        if: ${{ env.HAS_TAP_TOKEN != 'true' }}
        run: echo "::notice::HOMEBREW_TAP_TOKEN or TAP_TOKEN not configured — skipping Homebrew tap update."

      - name: Getting the repo
        if: ${{ env.HAS_TAP_TOKEN == 'true' }}
        uses: actions/checkout@v4

      - name: Download release DMG and compute SHA256
        if: ${{ env.HAS_TAP_TOKEN == 'true' }}
        env:
          VERSION: ${{ needs.get-update-version.outputs.new_version }}
        run: |
          # Assets can take a moment to propagate right after publish; retry
          # instead of stranding Homebrew users on the previous version.
          curl -fSL --retry 6 --retry-all-errors --retry-delay 10 -o release.dmg \
            "https://github.com/defai-digital/ax-studio/releases/download/v${VERSION}/AX.Studio_${VERSION}_aarch64.dmg"
          echo "DMG_SHA256=$(sha256sum release.dmg | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Push updated cask to homebrew tap
        if: ${{ env.HAS_TAP_TOKEN == 'true' }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.TAP_TOKEN }}
          VERSION: ${{ needs.get-update-version.outputs.new_version }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/defai-digital/homebrew-ax-studio.git" homebrew-tap
          node scripts/release/write-homebrew-cask.mjs \
            --version "$VERSION" \
            --sha256 "$DMG_SHA256" \
            --out homebrew-tap/Casks/ax-studio.rb
          ruby -c homebrew-tap/Casks/ax-studio.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/ax-studio.rb
          git diff --cached --quiet && echo "No cask changes to commit." && exit 0
          git commit -m "Update ax-studio cask to ${VERSION}"
          git push
