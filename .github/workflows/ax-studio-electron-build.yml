name: Electron Build & Release

# Replaces the retired Tauri release workflows. Packages the Electron shell
# (electron-builder via scripts/dist-electron.mjs) for macOS and Windows and,
# on version tags (or manual dispatch with publish=true), attaches the
# installers plus the electron-updater feeds (latest-mac.yml / latest.yml /
# blockmaps) to the GitHub Release that the packaged app polls.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Attach artifacts to a GitHub Release (false = dry build, artifacts only)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Getting the repo
        uses: actions/checkout@v7

      - name: Installing node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Resolve and verify version
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          # scripts/dist-electron.mjs injects the ROOT package.json version
          # into the build via -c.extraMetadata.version, so a tag that does
          # not match it would publish a mis-versioned release.
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} (version ${TAG_VERSION}) does not match root package.json version ${PKG_VERSION}."
              echo "Bump the version field in the root package.json to match the tag, then re-tag."
              exit 1
            fi
          fi
          echo "Resolved version: ${PKG_VERSION}"

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn install --immutable
          yarn build:core

      - name: Configure signing and notarization
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          RELEASE_PUBLISH: ${{ github.ref_type == 'tag' || inputs.publish == true }}
        run: |
          set -euo pipefail
          signed=0
          if [[ -n "${APPLE_CERTIFICATE}" || -n "${APPLE_SIGNING_IDENTITY}" ]]; then
            signed=1
          fi

          notary=0
          if [[ -n "${APPLE_API_KEY_B64}" ]]; then
            # electron-builder reads APPLE_API_KEY as a path to the .p8 file.
            printf '%s' "${APPLE_API_KEY_B64}" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"
            notary=1
          elif [[ -n "${APPLE_ID}" && -n "${APPLE_APP_SPECIFIC_PASSWORD}" ]]; then
            notary=1
          fi

          if [[ "$signed" -eq 0 ]]; then
            echo "No Apple signing secrets — building unsigned (CSC_IDENTITY_AUTO_DISCOVERY=false)."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          else
            echo "SIGNING_ARGS=-c.forceCodeSigning=true" >> "$GITHUB_ENV"
          fi

          # electron-builder.yml ships notarize: true (release default); keep
          # it enabled only when the app is actually signed AND notary
          # credentials exist. Otherwise explicitly disable it so an unsigned
          # (or signed-but-not-notarized) dry build never tries to notarize.
          if [[ "$signed" -eq 1 && "$notary" -eq 1 ]]; then
            echo "Apple signing + notarization credentials present — notarization enabled."
            echo "NOTARIZE_ARGS=-c.mac.notarize=true" >> "$GITHUB_ENV"
          else
            echo "Signing or notarization credentials missing — notarization disabled."
            echo "NOTARIZE_ARGS=-c.mac.notarize=false" >> "$GITHUB_ENV"
          fi

          if [[ "$RELEASE_PUBLISH" == "true" && ( "$signed" -ne 1 || "$notary" -ne 1 ) ]]; then
            echo "::error::Published macOS releases require signing and notarization credentials."
            exit 1
          fi

      - name: Prepare signing keychain (macOS)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # Only manage a keychain when signing credentials are present; the
          # unsigned path (CSC_IDENTITY_AUTO_DISCOVERY=false) needs none.
          if [[ -z "${APPLE_CERTIFICATE}" && -z "${APPLE_SIGNING_IDENTITY}" ]]; then
            echo "No signing credentials — skipping keychain setup."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/ax-studio-signing.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/ax-studio-signing.p12"

          # electron-builder's own temp keychain fails with "SecKeychainUnlock:
          # The user name or passphrase you entered is not correct" on the
          # macOS runner, so build the keychain here and hand it to
          # electron-builder via CSC_KEYCHAIN instead of CSC_LINK.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          if [[ -n "${APPLE_CERTIFICATE}" ]]; then
            printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "$CERT_PATH"
            # -A lets codesign reach the key without the partition-list dance.
            security import "$CERT_PATH" \
              -P "${APPLE_CERTIFICATE_PASSWORD:-}" \
              -A -t cert -f pkcs12 \
              -k "$KEYCHAIN_PATH" \
              -T /usr/bin/codesign -T /usr/bin/productbuild
            security set-key-partition-list \
              -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          fi

          # Put our keychain first on the search list so codesign/find-identity
          # can reach it.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          if [[ -n "${APPLE_SIGNING_IDENTITY}" ]]; then
            echo "CSC_NAME=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          fi

          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true

      - name: Build and package (macOS)
        run: |
          set -euo pipefail
          extra_args=()
          if [[ -n "${SIGNING_ARGS:-}" ]]; then
            extra_args+=("$SIGNING_ARGS")
          fi
          if [[ -n "${NOTARIZE_ARGS:-}" ]]; then
            extra_args+=("$NOTARIZE_ARGS")
          fi
          node scripts/dist-electron.mjs --mac "${extra_args[@]}"
        env:
          NODE_OPTIONS: '--max-old-space-size=4196'
          # CSC_KEYCHAIN (and CSC_NAME, when configured) are exported by the
          # "Prepare signing keychain" step. CSC_LINK / CSC_KEY_PASSWORD are
          # intentionally omitted so electron-builder reuses that keychain
          # instead of creating its own (which fails on the macOS runner).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify published macOS application
        if: github.ref_type == 'tag' || inputs.publish == true
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' bundle; do
            codesign --verify --deep --strict --verbose=2 "$bundle"
            xcrun stapler validate "$bundle"
            spctl --assess --type execute --verbose=2 "$bundle"
            found=1
          done < <(find electron/dist-installer -maxdepth 3 -name '*.app' -type d -print0)
          [[ "$found" -eq 1 ]] || { echo "::error::No macOS app found for release verification"; exit 1; }

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: electron-dist-macos
          retention-days: 14
          path: |
            electron/dist-installer/*.dmg
            electron/dist-installer/*.zip
            electron/dist-installer/*.blockmap
            electron/dist-installer/latest-mac.yml

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Getting the repo
        uses: actions/checkout@v7

      - name: Installing node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Resolve and verify version
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} (version ${TAG_VERSION}) does not match root package.json version ${PKG_VERSION}."
              echo "Bump the version field in the root package.json to match the tag, then re-tag."
              exit 1
            fi
          fi
          echo "Resolved version: ${PKG_VERSION}"

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn install --immutable
          yarn build:core

      - name: Build and package (Windows)
        run: |
          node scripts/dist-electron.mjs --win
        env:
          NODE_OPTIONS: '--max-old-space-size=4196'
          # Optional Authenticode signing; when the secrets are absent
          # electron-builder skips signing with a warning and still succeeds.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: electron-dist-windows
          retention-days: 14
          path: |
            electron/dist-installer/*.exe
            electron/dist-installer/*.blockmap
            electron/dist-installer/latest.yml

  release:
    if: github.event_name == 'push' || inputs.publish
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Getting the repo
        uses: actions/checkout@v7

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            # workflow_dispatch with publish=true: release from the
            # package.json version on this ref.
            TAG_NAME="v$(node -p "require('./package.json').version")"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG_NAME}"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: electron-dist-*
          merge-multiple: true
          path: release-assets

      - name: List release assets
        run: ls -la release-assets

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: AX Studio ${{ steps.tag.outputs.tag_name }}
          files: release-assets/**
