name: tauri-build-windows-arm64
on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: 'refs/heads/main'
      public_provider:
        required: false
        type: string
        default: none
        description: 'none: build only, github: build and publish to github, aws s3: build and publish to aws s3'
      new_version:
        required: false
        type: string
        default: ''
      cortex_api_port:
        required: false
        type: string
        default: ''
      upload_url:
        required: false
        type: string
        default: ''
      channel:
        required: false
        type: string
        default: 'nightly'
        description: 'The channel to use for this job'
      microsoft_store:
        required: false
        type: boolean
        default: false
        description: 'Build the offline NSIS package used for Microsoft Store submission'
    secrets:
      DELTA_AWS_S3_BUCKET_NAME:
        required: false
      DELTA_AWS_ACCESS_KEY_ID:
        required: false
      DELTA_AWS_SECRET_ACCESS_KEY:
        required: false
      AZURE_KEY_VAULT_URI:
        required: true
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_CLIENT_SECRET:
        required: true
      AZURE_CERT_NAME:
        required: true
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      TAURI_UPDATER_PUBKEY:
        required: false
      AX_STUDIO_SIGNING_KEY:
        required: false
      DELTA_AWS_REGION:
        required: false
    outputs:
      WIN_ARM64_SIG:
        value: ${{ jobs.build-windows-arm64.outputs.WIN_ARM64_SIG }}
      FILE_NAME:
        value: ${{ jobs.build-windows-arm64.outputs.FILE_NAME }}
      PORTABLE_FILE_NAME:
        value: ${{ jobs.build-windows-arm64.outputs.PORTABLE_FILE_NAME }}

permissions:
  contents: read

jobs:
  build-windows-arm64:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      # whisper.cpp's ARM backend rejects MSVC. Force cmake-rs to use the
      # supported clang-cl + Ninja path for ARM64 native dependencies while
      # keeping Rust and the final application on the MSVC ABI target.
      TARGET_CMAKE_GENERATOR: Ninja
      CC_aarch64_pc_windows_msvc: clang-cl
      CXX_aarch64_pc_windows_msvc: clang-cl
      CMAKE_C_COMPILER_TARGET: aarch64-pc-windows-msvc
      CMAKE_CXX_COMPILER_TARGET: aarch64-pc-windows-msvc
    outputs:
      WIN_ARM64_SIG: ${{ steps.metadata.outputs.WIN_ARM64_SIG }}
      FILE_NAME: ${{ steps.metadata.outputs.FILE_NAME }}
      PORTABLE_FILE_NAME: ${{ steps.metadata.outputs.PORTABLE_FILE_NAME }}
    permissions:
      contents: write
    steps:
      - name: Getting the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Replace Icons for Beta Build
        if: inputs.channel != 'stable'
        shell: bash
        run: |
          cp .github/scripts/icon-${{ inputs.channel }}.png src-tauri/icons/icon.png

      - name: Installing node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable long paths
        run: git config --global core.longpaths true

      - name: Install jq
        uses: dcarbone/install-jq-action@v2.0.1

      - name: Add Windows ARM64 Rust target
        run: rustup target add aarch64-pc-windows-msvc

      - name: Validate Windows ARM64 native toolchain
        shell: pwsh
        run: |
          Get-Command clang-cl.exe -ErrorAction Stop | Format-List Source
          Get-Command ninja.exe -ErrorAction Stop | Format-List Source
          clang-cl --version
          if ($LASTEXITCODE -ne 0) {
            throw "clang-cl is required for Windows ARM64 native dependencies."
          }
          ninja --version
          if ($LASTEXITCODE -ne 0) {
            throw "Ninja is required for Windows ARM64 native dependencies."
          }

      - name: Install AzureSignTool
        run: |
          dotnet tool install --global --version 6.0.0 AzureSignTool

      - name: Validate Windows signing configuration
        shell: pwsh
        env:
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
        run: |
          $required = @('AZURE_KEY_VAULT_URI', 'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_CLIENT_SECRET', 'AZURE_CERT_NAME')
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            throw "Windows code signing secrets are missing: $($missing -join ', ')"
          }
          AzureSignTool.exe --version

      - name: Update app version from release tag
        env:
          VERSION: ${{ inputs.new_version }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        shell: bash
        run: |
          node scripts/release/set-version.mjs \
            --version "$VERSION" \
            --channel "${{ inputs.channel }}" \
            ${TAURI_UPDATER_PUBKEY:+--updater-pubkey "$TAURI_UPDATER_PUBKEY"} \
            --windows-sign-command

      - name: Configure channel-specific settings
        if: inputs.channel != 'stable'
        shell: bash
        run: |
          if [[ "${{ inputs.channel }}" == "nightly" ]]; then
            jq '.plugins.updater.endpoints = ["https://apps-nightly.axstudio.ai/update-check", "https://delta.axstudio.ai/${{ inputs.channel }}/latest.json"]' ./src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          else
            jq '.plugins.updater.endpoints = ["https://delta.axstudio.ai/${{ inputs.channel }}/latest.json"]' ./src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          fi
          mv /tmp/tauri.conf.json ./src-tauri/tauri.conf.json

          chmod +x .github/scripts/rename-tauri-app.sh
          .github/scripts/rename-tauri-app.sh ./src-tauri/tauri.conf.json ${{ inputs.channel }}

          chmod +x .github/scripts/rename-workspace.sh
          .github/scripts/rename-workspace.sh ./package.json ${{ inputs.channel }}

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls true
          yarn install --immutable

      - name: Build app
        shell: bash
        run: |
          make build
        env:
          TAURI_BUILD_CONFIG: ${{ inputs.microsoft_store && 'src-tauri/tauri.microsoftstore.conf.json' || '' }}
          AX_STUDIO_WINDOWS_TARGET: aarch64-pc-windows-msvc
          TAURI_BUILD_TARGET: aarch64-pc-windows-msvc
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DELTA_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DELTA_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_MAX_ATTEMPTS: '5'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          AX_STUDIO_SIGNING_KEY: ${{ secrets.AX_STUDIO_SIGNING_KEY }}

      ## Set output filename for windows arm64
      - name: Set output filename for windows arm64
        id: metadata
        shell: bash
        env:
          VERSION: ${{ inputs.new_version }}
        run: |
          TARGET_DIR="./src-tauri/target/aarch64-pc-windows-msvc/release"
          NSIS_DIR="${TARGET_DIR}/bundle/nsis"
          if [ "${{ inputs.channel }}" != "stable" ]; then
            RAW_FILE_NAME="AX Studio-${{ inputs.channel }}_${VERSION}_arm64-setup.exe"
            FILE_NAME="AX.Studio-${{ inputs.channel }}_${VERSION}_arm64-setup.exe"
          else
            RAW_FILE_NAME="AX Studio_${VERSION}_arm64-setup.exe"
            FILE_NAME="AX.Studio_${VERSION}_arm64-setup.exe"
          fi
          if [ -f "${NSIS_DIR}/${RAW_FILE_NAME}" ]; then
            mv "${NSIS_DIR}/${RAW_FILE_NAME}" "${NSIS_DIR}/${FILE_NAME}"
          fi
          if [ -f "${NSIS_DIR}/${RAW_FILE_NAME}.sig" ]; then
            mv "${NSIS_DIR}/${RAW_FILE_NAME}.sig" "${NSIS_DIR}/${FILE_NAME}.sig"
          fi
          WIN_ARM64_SIG=""
          if [ -f "${NSIS_DIR}/${FILE_NAME}.sig" ]; then
            WIN_ARM64_SIG=$(cat "${NSIS_DIR}/${FILE_NAME}.sig")
          fi
          if [ "${{ inputs.channel }}" != "stable" ]; then
            PORTABLE_FILE_NAME="AX.Studio-${{ inputs.channel }}_${VERSION}_arm64-portable.exe"
          else
            PORTABLE_FILE_NAME="AX.Studio_${VERSION}_arm64-portable.exe"
          fi
          PORTABLE_SRC=$(find "$TARGET_DIR" -maxdepth 1 -type f \( -name "AX Studio*.exe" -o -name "ax-studio.exe" \) -print -quit || true)
          if [ -n "$PORTABLE_SRC" ] && [ -f "$PORTABLE_SRC" ]; then
            cp "$PORTABLE_SRC" "${TARGET_DIR}/${PORTABLE_FILE_NAME}"
          else
            echo "::notice::Portable Windows ARM64 exe not found; continuing with NSIS installer only."
          fi
          {
            echo "WIN_ARM64_SIG=${WIN_ARM64_SIG}"
            echo "FILE_NAME=${FILE_NAME}"
            echo "PORTABLE_FILE_NAME=${PORTABLE_FILE_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload NSIS Installer Artifact
        if: ${{ !inputs.microsoft_store }}
        uses: actions/upload-artifact@v7
        with:
          name: ax-studio-windows-arm64-exe-${{ inputs.new_version }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ./src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe

      - name: Upload Microsoft Store NSIS artifact
        if: inputs.microsoft_store
        uses: actions/upload-artifact@v7
        with:
          name: ax-studio-windows-store-arm64-exe-${{ inputs.new_version }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ./src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe

      ## Upload to s3 for nightly and beta
      - name: upload to aws s3 if public provider is aws
        shell: bash
        if: inputs.public_provider == 'aws-s3' || inputs.channel == 'beta'
        run: |
          TARGET_DIR="./src-tauri/target/aarch64-pc-windows-msvc/release"
          NSIS_DIR="${TARGET_DIR}/bundle/nsis"
          aws s3 cp "${NSIS_DIR}/${{ steps.metadata.outputs.FILE_NAME }}" "s3://${{ secrets.DELTA_AWS_S3_BUCKET_NAME }}/temp-${{ inputs.channel }}/${{ steps.metadata.outputs.FILE_NAME }}"
          aws s3 cp "${NSIS_DIR}/${{ steps.metadata.outputs.FILE_NAME }}.sig" "s3://${{ secrets.DELTA_AWS_S3_BUCKET_NAME }}/temp-${{ inputs.channel }}/${{ steps.metadata.outputs.FILE_NAME }}.sig"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DELTA_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DELTA_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.DELTA_AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'

      - name: Upload release artifacts to GitHub release
        if: inputs.public_provider == 'github'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.new_version }}
        run: |
          TARGET_DIR="./src-tauri/target/aarch64-pc-windows-msvc/release"
          NSIS_DIR="${TARGET_DIR}/bundle/nsis"
          FILES=("$NSIS_DIR/${{ steps.metadata.outputs.FILE_NAME }}")
          PORTABLE="${TARGET_DIR}/${{ steps.metadata.outputs.PORTABLE_FILE_NAME }}"
          [ -f "$PORTABLE" ] && FILES+=("$PORTABLE")
          gh release upload "v${VERSION}" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
