name: "Auto Label Conventional Commits"
on:
  pull_request:
    types:
      - reopened
      - opened
      - edited
      - synchronize

permissions:
  contents: read

jobs:
  label_prs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Label PRs
        uses: actions/github-script@v8
        with:
          script: |
            const type = /^(\w+)(?:\([^\r\n)]+\))?!?:/.exec(context.payload.pull_request.title)?.[1];
            const labels = {chore: 'type: chore', feat: 'type: feature request', perf: 'type: enhancement', fix: 'type: bug', docs: 'type: documentation', ci: 'type: ci', build: 'type: ci', test: 'type: chore', style: 'type: chore', refactor: 'type: chore'};
            const name = Object.hasOwn(labels, type) ? labels[type] : undefined;
            if (!name) return;
            try {
              await github.rest.issues.getLabel({...context.repo, name});
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({...context.repo, name, color: '5319e7'});
              } catch (creationError) {
                if (creationError.status !== 422) throw creationError;
                await github.rest.issues.getLabel({...context.repo, name});
              }
            }
            await github.rest.issues.addLabels({...context.repo, issue_number: context.issue.number, labels: [name]});
