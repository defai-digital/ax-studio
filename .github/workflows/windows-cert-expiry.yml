name: Windows cert expiry check

# Surfaces DigiCert / Key Vault signing-certificate renewal windows even when
# no PR or release is running. Policy lives in scripts/release/windows-cert-expiry.mjs
# and is also enforced by yarn validate:release on every PR/release preflight.

on:
  schedule:
    # Mondays 15:00 UTC
    - cron: '0 15 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-windows-cert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Getting the repo
        uses: actions/checkout@v7

      - name: Installing node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate release config (includes cert expiry tiers)
        run: node scripts/release/validate-release-config.mjs
