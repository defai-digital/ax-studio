name: Linter & Test
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'yarn.lock'
      - '.nvmrc'
      - '.prettierignore'
      - '.prettierrc'
      - '.yarnrc.yml'
      - 'vitest.config.ts'
      - 'scripts/**'
      - 'core/**'
      - 'extensions/**'
      - 'src-tauri/**'
      - 'web-app/**'
      - '!README.md'
      - 'Makefile'

  pull_request:
    branches:
      - main
      - release/**
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'yarn.lock'
      - '.nvmrc'
      - '.prettierignore'
      - '.prettierrc'
      - '.yarnrc.yml'
      - 'vitest.config.ts'
      - 'scripts/**'
      - 'Makefile'
      - 'extensions/**'
      - 'core/**'
      - 'src-tauri/**'
      - 'web-app/**'
      - '!README.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Getting the repo
        uses: actions/checkout@v7

      - name: Set up Go for actionlint
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'

      - name: Lint GitHub Actions workflows
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Set up Node.js for release config validation
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate release config
        run: node scripts/release/validate-release-config.mjs

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Getting the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go for gitleaks
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'

      - name: Scan git history for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          zero_sha="0000000000000000000000000000000000000000"

          if [[ "$EVENT_NAME" == "pull_request" && -n "$BASE_SHA" && -n "$HEAD_SHA" ]]; then
            gitleaks_log_opts="$BASE_SHA..$HEAD_SHA"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "$zero_sha" ]]; then
            gitleaks_log_opts="$BEFORE_SHA..$GITHUB_SHA"
          elif parent_sha="$(git rev-parse "$GITHUB_SHA^" 2>/dev/null)"; then
            gitleaks_log_opts="$parent_sha..$GITHUB_SHA"
          else
            gitleaks_log_opts="$GITHUB_SHA"
          fi

          echo "Scanning git range: $gitleaks_log_opts"
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 detect --source . --redact --exit-code 1 --verbose --log-opts "$gitleaks_log_opts"

  base_branch_cov:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: 'Cleanup cache'
        continue-on-error: true
        run: |
          rm -rf ~/ax-studio
          make clean

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls true

      - name: Install dependencies
        run: |
          make lint

      - name: Run test coverage
        continue-on-error: true
        run: |
          yarn test:coverage

      - name: Upload code coverage for ref branch
        uses: actions/upload-artifact@v7
        with:
          name: ref-lcov.info
          retention-days: 14
          path: coverage/lcov.info

  test-on-macos:
    runs-on: 'macos-latest'
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Getting the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installing node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: 'Cleanup cache'
        continue-on-error: true
        run: |
          rm -rf ~/ax-studio
          make clean

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls true

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Install pinned MLX build dependency
        run: |
          set -euo pipefail
          MLX_VENV="$RUNNER_TEMP/ax-studio-mlx-venv"
          python3 -m venv "$MLX_VENV"
          PYO3_PYTHON="$MLX_VENV/bin/python" node scripts/prepare-mlx-runtime.mjs
          echo "VIRTUAL_ENV=$MLX_VENV" >> "$GITHUB_ENV"
          echo "$MLX_VENV/bin" >> "$GITHUB_PATH"
          "$MLX_VENV/bin/python" -c 'import importlib.metadata; print("MLX", importlib.metadata.version("mlx"))'

      - name: Linter and test
        run: |
          make test
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  test-on-windows:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: 'windows-latest'
    timeout-minutes: 45
    steps:
      - name: Getting the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: install dependencies
        run: |
          choco install --yes --no-progress make

      - name: Installing node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Clean cache, continue on error
      - name: 'Cleanup cache'
        shell: powershell
        continue-on-error: true
        run: |
          $path = "$Env:APPDATA\AX Studio"
          if (Test-Path $path) {
              Remove-Item "\\?\$path" -Recurse -Force
          } else {
              Write-Output "Folder does not exist."
          }
          make clean

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls true

      - name: Configure Cargo for Windows paths
        shell: powershell
        run: |
          git config --global core.longpaths true
          New-Item -ItemType Directory -Force C:\cargo | Out-Null
          New-Item -ItemType Directory -Force C:\cargo-target | Out-Null

      - name: Lint
        shell: powershell
        timeout-minutes: 20
        run: |
          make lint
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'
          CARGO_HOME: C:\cargo
          CARGO_TARGET_DIR: C:\cargo-target
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

      - name: Download binaries
        shell: powershell
        timeout-minutes: 15
        run: |
          npx -y @yarnpkg/cli-dist@4.5.3 download:bin
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'
          CARGO_HOME: C:\cargo
          CARGO_TARGET_DIR: C:\cargo-target
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

      - name: Vitest
        shell: powershell
        timeout-minutes: 20
        run: |
          # Node 24 on Windows can fail during child-process pool teardown after
          # all Vitest tests pass. Thread workers keep the same test coverage
          # while avoiding that platform-specific cleanup path.
          npx -y @yarnpkg/cli-dist@4.5.3 vitest run --pool=threads
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'
          CARGO_HOME: C:\cargo
          CARGO_TARGET_DIR: C:\cargo-target
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

      - name: Prepare Tauri test assets
        shell: powershell
        timeout-minutes: 10
        run: |
          npx -y @yarnpkg/cli-dist@4.5.3 copy:assets:tauri
          npx -y @yarnpkg/cli-dist@4.5.3 build:icon
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'
          CARGO_HOME: C:\cargo
          CARGO_TARGET_DIR: C:\cargo-target
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

      - name: Cargo test src-tauri
        shell: powershell
        timeout-minutes: 30
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features test-tauri -- --test-threads=1
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'
          CARGO_HOME: C:\cargo
          CARGO_TARGET_DIR: C:\cargo-target
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

      - name: Cargo test hardware plugin
        shell: powershell
        timeout-minutes: 15
        run: |
          cargo test --manifest-path src-tauri/plugins/tauri-plugin-hardware/Cargo.toml
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'
          CARGO_HOME: C:\cargo
          CARGO_TARGET_DIR: C:\cargo-target
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

      - name: Cargo test utils
        shell: powershell
        timeout-minutes: 10
        run: |
          cargo test --manifest-path src-tauri/utils/Cargo.toml
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'
          CARGO_HOME: C:\cargo
          CARGO_TARGET_DIR: C:\cargo-target
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

  test-on-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Getting the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Installing node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Tauri dependencies
        run: |
          sudo apt update
          sudo apt install -y libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev libfuse2 libdbus-1-dev libasound2-dev webkit2gtk-driver

      - name: 'Cleanup cache'
        continue-on-error: true
        run: |
          rm -rf ~/ax-studio
          make clean

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls true

      - name: Linter and test
        run: |
          display_id=$(w -h | awk 'NR==1 {print $2}')
          export DISPLAY="$display_id"
          printf 'Display ID: %s\n' "$DISPLAY"
          make test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: electron/playwright-report/
          retention-days: 2

  coverage-check:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: base_branch_cov
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Getting the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installing node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: 'Cleanup cache'
        continue-on-error: true
        run: |
          rm -rf ~/ax-studio
          make clean

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls true

      - name: Install dependencies
        run: |
          make lint

      - name: Run test coverage
        run: |
          yarn test:coverage

      - name: Run module coverage audit (blocking)
        run: |
          mkdir -p report/testing
          node scripts/testing/module-coverage-audit.mjs --out-dir report/testing
          node scripts/testing/module-coverage-gate.mjs --audit report/testing/module-coverage-audit.json --thresholds scripts/testing/module-thresholds.json --mode blocking

      - name: Download code coverage report from base branch
        uses: actions/download-artifact@v8
        with:
          name: ref-lcov.info
      - name: Generate Code Coverage report
        id: code-coverage
        uses: barecheck/code-coverage-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: './coverage/lcov.info'
          base-lcov-file: './lcov.info'
          send-summary-comment: ${{ github.actor != 'dependabot[bot]' }}
          show-annotations: 'warning'

      - name: Upload module audit artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: module-coverage-audit
          retention-days: 14
          path: report/testing/
