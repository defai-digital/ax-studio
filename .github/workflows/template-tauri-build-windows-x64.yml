name: tauri-build-windows-x64
on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: 'refs/heads/main'
      public_provider:
        required: false
        type: string
        default: none
        description: 'none: build only, github: build and publish to github, aws s3: build and publish to aws s3'
      new_version:
        required: false
        type: string
        default: ''
      cortex_api_port:
        required: false
        type: string
        default: ''
      upload_url:
        required: false
        type: string
        default: ''
      channel:
        required: false
        type: string
        default: 'nightly'
        description: 'The channel to use for this job'
    secrets:
      DELTA_AWS_S3_BUCKET_NAME:
        required: false
      DELTA_AWS_ACCESS_KEY_ID:
        required: false
      DELTA_AWS_SECRET_ACCESS_KEY:
        required: false
      AZURE_KEY_VAULT_URI:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_CERT_NAME:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      TAURI_UPDATER_PUBKEY:
        required: false
      AX_STUDIO_SIGNING_KEY:
        required: false
      DELTA_AWS_REGION:
        required: false
    outputs:
      WIN_SIG:
        value: ${{ jobs.build-windows-x64.outputs.WIN_SIG }}
      FILE_NAME:
        value: ${{ jobs.build-windows-x64.outputs.FILE_NAME }}
      MSI_FILE_NAME:
        value: ${{ jobs.build-windows-x64.outputs.MSI_FILE_NAME }}
      PORTABLE_FILE_NAME:
        value: ${{ jobs.build-windows-x64.outputs.PORTABLE_FILE_NAME }}

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      WIN_SIG: ${{ steps.metadata.outputs.WIN_SIG }}
      FILE_NAME: ${{ steps.metadata.outputs.FILE_NAME }}
      MSI_FILE_NAME: ${{ steps.metadata.outputs.MSI_FILE_NAME }}
      PORTABLE_FILE_NAME: ${{ steps.metadata.outputs.PORTABLE_FILE_NAME }}
    permissions:
      contents: write
    steps:
      - name: Getting the repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Replace Icons for Beta Build
        if: inputs.channel != 'stable'
        shell: bash
        run: |
          cp .github/scripts/icon-${{ inputs.channel }}.png src-tauri/icons/icon.png

      - name: Installing node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19'

      - name: Install jq
        uses: dcarbone/install-jq-action@v2.0.1

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install ctoml
        run: cargo binstall ctoml --no-confirm

      - name: Update app version from release tag
        env:
          VERSION: ${{ inputs.new_version }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        shell: bash
        run: |
          node scripts/release/set-version.mjs \
            --version "$VERSION" \
            --channel "${{ inputs.channel }}" \
            ${TAURI_UPDATER_PUBKEY:+--updater-pubkey "$TAURI_UPDATER_PUBKEY"} \
            --windows-sign-command

      - name: Configure Windows-specific settings and NSIS template
        shell: bash
        run: |
          jq '.bundle.windows.nsis.template = "tauri.bundle.windows.nsis.template"' ./src-tauri/tauri.windows.conf.json > /tmp/tauri.windows.conf.json
          mv /tmp/tauri.windows.conf.json ./src-tauri/tauri.windows.conf.json

          generate_build_version() {
              local new_version="$1"
              local base_version t_value
              if [[ "$new_version" == *-* ]]; then
                  base_version="${new_version%%-*}"
                  suffix="${new_version#*-}"
                  if [[ "$suffix" =~ ^rc([0-9]+)-beta$ ]]; then
                      t_value="${BASH_REMATCH[1]}"
                  else
                      t_value="$suffix"
                  fi
              else
                  base_version="$new_version"
                  t_value="0"
              fi
              new_base_version="$base_version"
              new_build_version="${base_version}.${t_value}"
          }
          generate_build_version ${{ inputs.new_version }}
          sed -i "s/ax_studio_version/$new_base_version/g" ./src-tauri/tauri.bundle.windows.nsis.template
          sed -i "s/ax_studio_build/$new_build_version/g" ./src-tauri/tauri.bundle.windows.nsis.template

          if [ "${{ inputs.channel }}" != "stable" ]; then
            if [[ "${{ inputs.channel }}" == "nightly" ]]; then
              jq '.plugins.updater.endpoints = ["https://apps-nightly.axstudio.ai/update-check", "https://delta.axstudio.ai/${{ inputs.channel }}/latest.json"]' ./src-tauri/tauri.conf.json > /tmp/tauri.conf.json
            else
              jq '.plugins.updater.endpoints = ["https://delta.axstudio.ai/${{ inputs.channel }}/latest.json"]' ./src-tauri/tauri.conf.json > /tmp/tauri.conf.json
            fi
            mv /tmp/tauri.conf.json ./src-tauri/tauri.conf.json

            jq --arg name "AX Studio-${{ inputs.channel }}" '.productName = $name' ./src-tauri/tauri.conf.json > /tmp/tauri.conf.json
            mv /tmp/tauri.conf.json ./src-tauri/tauri.conf.json

            chmod +x .github/scripts/rename-tauri-app.sh
            .github/scripts/rename-tauri-app.sh ./src-tauri/tauri.conf.json ${{ inputs.channel }}

            ctoml ./src-tauri/Cargo.toml package.name "ax-studio-${{ inputs.channel }}"

            chmod +x .github/scripts/rename-workspace.sh
            .github/scripts/rename-workspace.sh ./package.json ${{ inputs.channel }}

            sed -i "s/ax_studio_productname/AX Studio-${{ inputs.channel }}/g" ./src-tauri/tauri.bundle.windows.nsis.template
            sed -i "s/ax_studio_mainbinaryname/ax-studio-${{ inputs.channel }}/g" ./src-tauri/tauri.bundle.windows.nsis.template
          else
            sed -i "s/ax_studio_productname/AX Studio/g" ./src-tauri/tauri.bundle.windows.nsis.template
            sed -i "s/ax_studio_mainbinaryname/ax-studio/g" ./src-tauri/tauri.bundle.windows.nsis.template
          fi

      - name: Install AzureSignTool
        run: |
          dotnet tool install --global --version 6.0.0 AzureSignTool

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Build app
        shell: bash
        run: |
          make build
        env:
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DELTA_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DELTA_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_MAX_ATTEMPTS: '5'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          AX_STUDIO_SIGNING_KEY: ${{ secrets.AX_STUDIO_SIGNING_KEY }}

      - name: Upload NSIS Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ax-studio-windows-exe-${{ inputs.new_version }}
          retention-days: 14
          path: |
            ./src-tauri/target/release/bundle/nsis/*.exe
      - name: Upload MSI Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ax-studio-windows-msi-${{ inputs.new_version }}
          retention-days: 14
          path: |
            ./src-tauri/target/release/bundle/msi/*.msi

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ax-studio-windows-portable-${{ inputs.new_version }}
          retention-days: 14
          path: |
            ./src-tauri/target/release/AX Studio*.exe

      ## Set output filename for windows
      - name: Set output filename for windows
        shell: bash
        run: |
          cd ./src-tauri/target/release/bundle/nsis
          if [ "${{ inputs.channel }}" != "stable" ]; then
            FILE_NAME="AX Studio-${{ inputs.channel }}_${{ inputs.new_version }}_x64-setup.exe"
            WIN_SIG=$(cat "AX Studio-${{ inputs.channel }}_${{ inputs.new_version }}_x64-setup.exe.sig")

            MSI_FILE="AX Studio-${{ inputs.channel }}_${{ inputs.new_version }}_x64_en-US.msi"
            PORTABLE_FILE_NAME="AX Studio-${{ inputs.channel }}_${{ inputs.new_version }}_x64-portable.exe"
          else
            FILE_NAME="AX Studio_${{ inputs.new_version }}_x64-setup.exe"
            WIN_SIG=$(cat "AX Studio_${{ inputs.new_version }}_x64-setup.exe.sig")
            
            MSI_FILE="AX Studio_${{ inputs.new_version }}_x64_en-US.msi"
            PORTABLE_FILE_NAME="AX Studio_${{ inputs.new_version }}_x64-portable.exe"
          fi
          # go to ./src-tauri/target/release
          cd ../..

          # find the actual portable exe produced by the build
          PORTABLE_SRC=$(find . -maxdepth 1 -type f -name 'AX Studio*.exe' -print -quit)
          if [ -z "$PORTABLE_SRC" ] || [ ! -f "$PORTABLE_SRC" ]; then
            echo "Error: portable exe matching 'AX Studio*.exe' not found in $(pwd)" >&2
            exit 1
          fi
          PORTABLE_SRC=${PORTABLE_SRC#./}
          # copy to deterministic versioned filename
          cp "$PORTABLE_SRC" "$PORTABLE_FILE_NAME"
          echo "Portable exe: $PORTABLE_SRC -> $PORTABLE_FILE_NAME"

          {
            echo "WIN_SIG=${WIN_SIG}"
            echo "FILE_NAME=${FILE_NAME}"
            echo "MSI_FILE_NAME=${MSI_FILE}"
            echo "PORTABLE_FILE_NAME=${PORTABLE_FILE_NAME}"
          } >> "$GITHUB_OUTPUT"
        id: metadata

      ## Upload to s3 for nightly and beta
      - name: upload to aws s3 if public provider is aws
        shell: bash
        if: inputs.public_provider == 'aws-s3' || inputs.channel == 'beta'
        run: |
          cd ./src-tauri/target/release/bundle/nsis

          # Upload for tauri updater
          aws s3 cp ./${{ steps.metadata.outputs.FILE_NAME }} s3://${{ secrets.DELTA_AWS_S3_BUCKET_NAME }}/temp-${{ inputs.channel }}/${{ steps.metadata.outputs.FILE_NAME }}
          aws s3 cp ./${{ steps.metadata.outputs.FILE_NAME }}.sig s3://${{ secrets.DELTA_AWS_S3_BUCKET_NAME }}/temp-${{ inputs.channel }}/${{ steps.metadata.outputs.FILE_NAME }}.sig
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DELTA_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DELTA_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.DELTA_AWS_REGION }}
          AWS_EC2_METADATA_DISABLED: 'true'

      - name: Upload release artifacts to GitHub release
        if: inputs.public_provider == 'github'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.new_version }}
        run: |
          NSIS_DIR="./src-tauri/target/release/bundle/nsis"
          FILES=("$NSIS_DIR/${{ steps.metadata.outputs.FILE_NAME }}")
          PORTABLE="./src-tauri/target/release/${{ steps.metadata.outputs.PORTABLE_FILE_NAME }}"
          [ -f "$PORTABLE" ] && FILES+=("$PORTABLE")
          gh release upload "v${VERSION}" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
