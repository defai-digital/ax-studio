# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#package-ecosystem-
version: 2
updates:
  - package-ecosystem: 'cargo'
    directory: 'src-tauri'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    ignore:
      # Tauri 2's Linux GTK/WebKit runtime stack still depends on gtk-rs 0.18,
      # which cannot consume glib >=0.20 without an upstream Tauri/GTK migration.
      - dependency-name: 'glib'
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - 'core'
      - 'extensions'
      - 'extensions/*'
      - 'web-app'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
